# Application
spring.application.name=config-test-app

# Server
server.port=8085
server.shutdown=graceful

# General application properties
app.name=Config Testing Service
app.version=1.2.0
app.enabled=true
app.max-retries=3
app.timeout-ms=5000
app.threshold=0.75
app.description=Testing configuration binding

# Database configuration
app.database.host=localhost
app.database.port=5432
app.database.name=testdb
app.database.username=testuser
app.database.password=testpassword
app.database.ssl-enabled=false

# Security configuration
app.security.jwt-expiration-ms=3600000
app.security.max-login-attempts=5
app.security.allowed-origins[0]=http://localhost:3000
app.security.allowed-origins[1]=http://localhost:5173

# Feature flags
app.features.caching=true
app.features.metrics=false
app.features.rate-limiting=true

# Supported formats
app.supported-formats[0]=JSON
app.supported-formats[1]=XML
app.supported-formats[2]=YAML

# Worker configuration
app.worker.pool-size=10
app.worker.queue-capacity=100
app.worker.idle-timeout=30s

feature-x-enabled=false